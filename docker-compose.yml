services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-issueflow}
      POSTGRES_USER: ${POSTGRES_USER:-issueflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issueflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-issueflow} -d ${POSTGRES_DB:-issueflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgres://issueflow:issueflow@db:5432/issueflow}
      CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
