services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-issueflow}
      POSTGRES_USER: ${POSTGRES_USER:-issueflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issueflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-issueflow} -d ${POSTGRES_DB:-issueflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgres://issueflow:issueflow@db:5432/issueflow}
      CORS_ORIGIN: ${BACKEND_CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "5174:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  gitlab:
    image: gitlab/gitlab-ce:latest
    restart: unless-stopped
    hostname: ${GITLAB_HOSTNAME:-gitlab.local}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost:8929}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
    ports:
      - "${GITLAB_HTTP_PORT:-8929}:8929"
      - "${GITLAB_HTTPS_PORT:-4430}:443"
      - "${GITLAB_SSH_PORT:-2224}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: "256m"

volumes:
  postgres_data:
  uploads_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
