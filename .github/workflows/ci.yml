name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm install

      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build
